  chainstay 415. Head tube (1190,185)-(1247,356) at 71.5 deg, fork rake ~45.
  Seat tube (808,775)-(662,297) at 73 deg. Stack 590, reach 382.
  Tubes are drawn hollow: an outer stroke in the line colour and a thinner
  inner stroke in the fill colour on the same path.
  Groups (data-part): frame, fork, wheels, groupset, brakes, cockpit, saddle.
  Each group starts with one invisible class="hit" shape (transparent fill
  and stroke) that covers the part for tapping.
